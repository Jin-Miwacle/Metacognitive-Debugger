<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Partner – Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .reading-card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; }
  .reading-card .row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .reading-card h3 { margin: 0 0 4px; }
  .reading-card .meta { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .reading-card .preview {
    font-family: var(--serif); font-size: 15px; line-height: 1.5; color: var(--muted);
    margin: 8px 0 0; max-height: 0; overflow: hidden; transition: max-height .2s ease;
  }
  .reading-card .preview.open { max-height: 600px; overflow-y: auto; }
  .reading-card .tiny { background: transparent; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; padding: 2px 0; }
  .reading-card .tiny.danger { color: var(--bug); }
  .new-reading { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
</style>
</head>
<body data-app="teacher">

<div id="authOverlay" class="auth-wrap"></div>

<div id="appRoot" hidden>
  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true"><span class="brand-mark-fallback">R</span><img src="logo.png" alt="" onerror="this.remove()"></span>
        <span class="sidebar-brand-text">
          Reading Partner
          <span class="app-role-badge" id="appRoleBadge">Teacher</span>
        </span>
      </div>
      <nav class="sidebar-nav" aria-label="Main">
        <button class="side-link" type="button" data-view="dashboard" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4.5" width="7" height="7" rx="1.4"/><rect x="13" y="4.5" width="7" height="7" rx="1.4"/><rect x="4" y="13.5" width="7" height="6" rx="1.4"/><rect x="13" y="13.5" width="7" height="6" rx="1.4"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="side-link" type="button" data-view="classes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8.3" r="3"/><path d="M3.6 19c.6-3 2.7-4.7 5.4-4.7s4.8 1.7 5.4 4.7"/><circle cx="17" cy="8.8" r="2.3"/><path d="M15.3 14.6c2.2.2 3.9 1.8 4.4 4.4"/></svg>
          <span>Classes</span>
        </button>
        <button class="side-link" type="button" data-view="admin" id="adminNavBtn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.4 19.5 6.7v5.4c0 4.5-3.1 7.4-7.5 8.5-4.4-1.1-7.5-4-7.5-8.5V6.7Z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>
          <span>Admin</span>
        </button>
        <button class="side-link" type="button" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.3 19.8 7.8V16.2L12 20.7 4.2 16.2V7.8Z"/><path d="M9.3 10.3h5.4v3.4H9.3Z"/></svg>
          <span>Settings</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="sidebar-user" id="userName"></div>
        <button class="ghost" type="button" onclick="signOut()">Log out</button>
      </div>
    </aside>

    <main class="main-area">

      <!-- DASHBOARD: readings list + add-reading form -->
      <section id="dashboardView" class="view">
        <div class="view-pad">
          <h1>Your readings</h1>
          <p class="hint">Add a passage for your students, then check back here to see where they got stuck.</p>

          <div id="readingList"></div>

          <div class="new-reading">
            <h3 style="margin:0 0 10px">Add a reading</h3>
            <form id="newReadingForm">
              <label class="f" for="rFile">Upload a file (PDF, Word, PowerPoint, or .txt)</label>
              <input type="file" id="rFile" accept=".pdf,.docx,.pptx,.txt">
              <p class="small" id="rFileMsg" style="min-height:16px"></p>
              <label class="f" for="rTitle">Title</label>
              <input type="text" id="rTitle" required>
              <label class="f" for="rBody">Text (one blank line between paragraphs) &mdash; filled in automatically if you uploaded a file above</label>
              <textarea id="rBody" style="min-height:160px" required></textarea>
              <div class="row" style="margin-top:12px">
                <button class="btn" type="submit">Add reading</button>
              </div>
              <p class="small" id="newReadingMsg" style="margin-top:8px"></p>
            </form>
          </div>
        </div>
      </section>

      <!-- CLASSES: create classes, see join codes and who's in them -->
      <section id="classesView" class="view" hidden>
        <div id="classesPane" class="view-pad"></div>
      </section>

      <!-- ADMIN: every account, every class (only shown to role = admin) -->
      <section id="adminView" class="view" hidden>
        <div id="adminPane" class="view-pad"></div>
      </section>

      <!-- SETTINGS: account details, password, appearance -->
      <section id="settingsView" class="view" hidden>
        <div id="settingsPane" class="view-pad"></div>
      </section>

    </main>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="fileExtract.js"></script>
<script src="auth.js"></script>
<script src="settings.js"></script>
<script>
let currentProfile = null;

document.getElementById('rFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = ''; // so picking the same file twice still fires "change"
  if (!file) return;
  const msg = document.getElementById('rFileMsg');
  msg.style.color = 'var(--muted)';
  msg.textContent = `Reading ${file.name}…`;
  try {
    const text = await extractTextFromFile(file);
    document.getElementById('rBody').value = text;
    const titleField = document.getElementById('rTitle');
    if (!titleField.value.trim()) titleField.value = file.name.replace(/\.[^.]+$/, '');
    msg.style.color = 'var(--ok)';
    msg.textContent = `Loaded text from ${file.name}. Review it below, then click "Add reading".`;
  } catch (err) {
    msg.style.color = 'var(--bug)';
    msg.textContent = err.message || 'Could not read that file.';
  }
});

function showView(name) {
  document.querySelectorAll('.side-link').forEach(b => {
    const active = b.dataset.view === name;
    b.classList.toggle('active', active);
    b.setAttribute('aria-current', active ? 'page' : 'false');
  });
  document.querySelectorAll('.view').forEach(v => { v.hidden = v.id !== name + 'View'; });
  if (name === 'settings') renderSettings('settingsPane', currentProfile);
  if (name === 'classes') loadClasses();
  if (name === 'admin') renderAdmin();
}
document.querySelectorAll('.side-link').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));

/* CLASSES: create a class (gets a join code), see who's joined, delete it */
function makeJoinCode() {
  // skip 0/O and 1/I -- easy to read and say out loud, hard to mistype
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

/* Labels matching the student-side wording in app.js, so a teacher sees
   the same words a student picked, not raw database values. */
const DEBUG_PROBLEM_LABEL = { vocab: 'A word they didn’t know', lost: 'Lost the point', connect: 'Ideas didn’t connect', why: 'Why did this happen?', unspecified: 'Other' };
const CHECKIN_LEVEL_LABEL = { clear: 'I follow it', fuzzy: 'A bit fuzzy', lost: 'I’m lost', unspecified: 'Other' };

/* A compact "where are they getting stuck" summary for one class --
   just enough to spot a pattern at a glance, not a full report. Shows
   nothing if the class has no debug/check-in data yet. */
function classInsightsHtml(debugRows, checkinRows) {
  if (!debugRows.length && !checkinRows.length) return '';
  const bars = (rows, labels) => {
    const total = rows.reduce((sum, r) => sum + Number(r.total), 0);
    if (!total) return '';
    return rows.map(r => {
      const pct = Math.round((Number(r.total) / total) * 100);
      const label = labels[r.problem || r.level] || labels.unspecified;
      return `<div class="insight-bar">
        <span class="insight-bar-label">${escapeHtml(label)}</span>
        <span class="insight-bar-track"><span class="insight-bar-fill" style="width:${pct}%"></span></span>
        <span class="insight-bar-count">${r.total}</span>
      </div>`;
    }).join('');
  };
  const debugHtml = bars(debugRows, DEBUG_PROBLEM_LABEL);
  const checkinHtml = bars(checkinRows, CHECKIN_LEVEL_LABEL);
  return `<div class="class-insights">
    ${debugHtml ? `<div><p class="small" style="margin:0 0 6px"><b>Where they're getting stuck</b></p>${debugHtml}</div>` : ''}
    ${checkinHtml ? `<div><p class="small" style="margin:10px 0 6px"><b>How check-ins have gone</b></p>${checkinHtml}</div>` : ''}
  </div>`;
}

async function loadClasses() {
  const el = document.getElementById('classesPane');
  el.innerHTML = `<h1>Your classes</h1><p class="hint">Loading…</p>`;

  const [{ data: classes, error }, { data: debugStats }, { data: checkinStats }] = await Promise.all([
    supa.from('classes').select('*').eq('teacher_id', currentProfile.id).order('created_at', { ascending: false }),
    supa.rpc('teacher_debug_stats'),
    supa.rpc('teacher_checkin_stats')
  ]);
  // Both RPCs are a newer addition (teacher_dashboard_migration.sql) -- an
  // older database without them just means no insights card, not a crash.

  if (error) {
    el.innerHTML = `<h1>Your classes</h1><p class="small" style="color:var(--bug)">${escapeHtml(error.message)}</p>`;
    return;
  }

  const cards = await Promise.all((classes || []).map(async (c) => {
    const { count } = await supa.from('class_members').select('student_id', { count: 'exact', head: true }).eq('class_id', c.id);
    const myDebug = (debugStats || []).filter(r => r.class_id === c.id);
    const myCheckins = (checkinStats || []).filter(r => r.class_id === c.id);
    return `<div class="reading-card" data-class="${c.id}">
      <div class="row-top">
        <div>
          <h3>${escapeHtml(c.name)}</h3>
          <p class="meta">Join code <b style="letter-spacing:2px; color:var(--ink)">${c.join_code}</b> &middot; ${count || 0} student${count === 1 ? '' : 's'} joined</p>
        </div>
        <button class="tiny danger" type="button" data-act="delete">Delete</button>
      </div>
      ${classInsightsHtml(myDebug, myCheckins)}
    </div>`;
  }));

  el.innerHTML = `
    <h1>Your classes</h1>
    <p class="hint">Create a class, then share its join code with your students. Only students who join can see the readings you add.</p>
    ${cards.length ? cards.join('') : '<p class="small">No classes yet. Create your first one below.</p>'}

    <div class="new-reading">
      <h3 style="margin:0 0 10px">Create a class</h3>
      <form id="newClassForm">
        <label class="f" for="cName">Class name</label>
        <input type="text" id="cName" placeholder="e.g. Grade 9 - Section A" required>
        <div class="row" style="margin-top:12px">
          <button class="btn" type="submit">Create class</button>
        </div>
      </form>
    </div>`;

  document.getElementById('newClassForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('cName').value.trim();
    if (!name) return;
    // codes are unique; collisions are rare, but retry a few times just in case
    let lastError = null;
    for (let attempt = 0; attempt < 4; attempt++) {
      const { error } = await supa.from('classes').insert({ teacher_id: currentProfile.id, name, join_code: makeJoinCode() });
      if (!error) { showToast('Class created.', 'ok'); loadClasses(); return; }
      lastError = error;
      if (!/duplicate|unique/i.test(error.message)) break;
    }
    showToast('Could not create class: ' + lastError.message, 'bug');
  });

  el.querySelectorAll('[data-act="delete"]').forEach(btn => btn.addEventListener('click', async () => {
    const card = btn.closest('.reading-card');
    if (!confirm('Delete this class? Students in it will lose access to your readings, and will need to join again if you recreate it.')) return;
    const { error } = await supa.from('classes').delete().eq('id', card.dataset.class);
    if (error) { showToast('Could not delete: ' + error.message, 'bug'); return; }
    showToast('Class deleted.', 'ok');
    loadClasses();
  }));
}

async function startTeacherPage(profile) {
  currentProfile = profile;
  document.getElementById('userName').textContent = profile.full_name || 'Teacher';
  if (profile.role === 'admin') {
    document.getElementById('adminNavBtn').hidden = false;
    document.getElementById('appRoleBadge').textContent = 'Admin';
  }
  showView('dashboard');

  document.getElementById('newReadingForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('rTitle').value.trim();
    const body = document.getElementById('rBody').value.trim();
    const msg = document.getElementById('newReadingMsg');
    if (!title || !body) return;
    const { error } = await supa.from('readings').insert({ teacher_id: profile.id, title, body });
    msg.textContent = error ? ('Could not save: ' + error.message) : 'Saved.';
    if (!error) {
      document.getElementById('rTitle').value = '';
      document.getElementById('rBody').value = '';
      loadReadings(profile.id);
    }
  });

  await loadReadings(profile.id);
}

async function loadReadings(teacherId) {
  const list = document.getElementById('readingList');
  list.innerHTML = '<p class="small">Loading...</p>';

  const { data: readings, error } = await supa
    .from('readings').select('*').eq('teacher_id', teacherId).order('created_at', { ascending: false });
  if (error) { list.innerHTML = `<p class="small" style="color:var(--bug)">${error.message}</p>`; return; }
  if (!readings.length) { list.innerHTML = '<p class="small">No readings yet. Add your first one below.</p>'; return; }

  // For each reading, count sessions and how many debug spots are open / resolved / still "stuck".
  const cards = await Promise.all(readings.map(async (r) => {
    const { data: sessions } = await supa.from('sessions').select('id').eq('reading_id', r.id);
    const sessionCount = sessions ? sessions.length : 0;
    let stuck = 0, resolved = 0, open = 0;
    if (sessionCount) {
      const ids = sessions.map(s => s.id);
      const { data: events } = await supa.from('debug_events').select('status').in('session_id', ids);
      (events || []).forEach(e => {
        if (e.status === 'stuck') stuck++; else if (e.status === 'resolved') resolved++; else open++;
      });
    }
    const when = new Date(r.created_at).toLocaleDateString();
    return `<div class="reading-card" data-reading="${r.id}">
      <div class="row-top">
        <div>
          <h3>${escapeHtml(r.title)}</h3>
          <p class="meta">Added ${when} &middot; ${sessionCount} student session${sessionCount === 1 ? '' : 's'}${sessionCount ? ` &middot; ${resolved} cleared up &middot; ${stuck} still stuck` : ''}</p>
        </div>
        <div class="row" style="gap:10px">
          <button class="tiny" type="button" data-act="preview">Show text</button>
          <button class="tiny danger" type="button" data-act="delete">Delete</button>
        </div>
      </div>
      <div class="preview" data-body="${escapeHtml(r.body)}"></div>
    </div>`;
  }));
  list.innerHTML = cards.join('');

  list.querySelectorAll('[data-act="preview"]').forEach(btn => btn.addEventListener('click', () => {
    const card = btn.closest('.reading-card');
    const box = card.querySelector('.preview');
    const open = box.classList.toggle('open');
    btn.textContent = open ? 'Hide text' : 'Show text';
    if (open && !box.innerHTML) {
      box.innerHTML = box.dataset.body.split(/\n\s*\n/).map(p => `<p>${escapeHtml(p)}</p>`).join('');
    }
  }));
  list.querySelectorAll('[data-act="delete"]').forEach(btn => btn.addEventListener('click', async () => {
    const card = btn.closest('.reading-card');
    if (!confirm('Delete this reading? Student sessions on it will be deleted too.')) return;
    const { error } = await supa.from('readings').delete().eq('id', card.dataset.reading);
    if (error) { alert('Could not delete: ' + error.message); return; }
    loadReadings(currentProfile.id);
  }));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ADMIN: every account (with a role dropdown) and every class, across all
   teachers. Only reachable when the profile's role is 'admin' -- the nav
   button stays hidden otherwise, and it's the database's own rules, not
   just this page, that actually block a non-admin from calling it directly. */
async function renderAdmin() {
  const el = document.getElementById('adminPane');
  el.innerHTML = '<h1>Admin</h1><p class="hint">Loading…</p>';

  const [{ data: rpcUsers, error: uErr }, { data: classes, error: cErr }] = await Promise.all([
    supa.rpc('admin_list_users'),
    supa.from('classes').select('id, name, join_code, teacher_id, created_at').order('created_at', { ascending: false })
  ]);
  if (cErr) { el.innerHTML = `<h1>Admin</h1><p class="small" style="color:var(--bug)">${escapeHtml(cErr.message)}</p>`; return; }

  let users = rpcUsers, hasEmails = true, emailError = '';
  if (uErr) {
    // falls back to a plain profiles query (no emails) if the migration
    // hasn't been run yet, or the RPC call fails for some other reason
    console.warn('admin_list_users() failed, falling back to profiles only:', uErr);
    emailError = uErr.message || String(uErr);
    const fallback = await supa.from('profiles').select('id, full_name, role').order('full_name');
    if (fallback.error) { el.innerHTML = `<h1>Admin</h1><p class="small" style="color:var(--bug)">${escapeHtml(fallback.error.message)}</p>`; return; }
    users = fallback.data; hasEmails = false;
  }

  await renderAdminBody(users, classes, el, hasEmails, emailError);
}

async function renderAdminBody(users, classes, el, hasEmails, emailError) {
  const nameById = {};
  (users || []).forEach(u => { nameById[u.id] = u.full_name || '(no name)'; });

  const memberCounts = {};
  if (classes && classes.length) {
    const { data: members } = await supa.from('class_members').select('class_id');
    (members || []).forEach(m => { memberCounts[m.class_id] = (memberCounts[m.class_id] || 0) + 1; });
  }

  const userRows = (users || []).map(u => `
    <div class="reading-row-card" data-user="${u.id}">
      <div>
        <b>${escapeHtml(u.full_name || '(no name)')}</b>
        <div class="small">${hasEmails ? escapeHtml(u.email || '') : ''}${u.id === currentProfile.id ? (hasEmails ? ' &middot; this is you' : 'This is you') : ''}</div>
      </div>
      <select data-role-for="${u.id}" ${u.id === currentProfile.id ? 'disabled title="You can\'t change your own role here."' : ''}>
        <option value="student" ${u.role === 'student' ? 'selected' : ''}>Student</option>
        <option value="teacher" ${u.role === 'teacher' ? 'selected' : ''}>Teacher</option>
        <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
      </select>
    </div>`).join('');

  const classRows = (classes || []).map(c => `
    <div class="reading-row-card" data-class="${c.id}">
      <div>
        <b>${escapeHtml(c.name)}</b>
        <div class="small">Teacher: ${escapeHtml(nameById[c.teacher_id] || '(unknown)')} &middot; Code ${c.join_code} &middot; ${memberCounts[c.id] || 0} student${memberCounts[c.id] === 1 ? '' : 's'}</div>
      </div>
      <button class="tiny danger" type="button" data-act="delete-class">Delete</button>
    </div>`).join('');

  el.innerHTML = `
    <h1>Admin</h1>
    <p class="hint">Every account and every class, across all teachers.</p>

    <h3 style="margin:22px 0 4px">Accounts (${(users || []).length})</h3>
    ${hasEmails ? '' : `<p class="small" style="margin:0 0 10px; color:var(--warn)">Email addresses aren't shown here yet &mdash; run admin_emails_migration.sql in Supabase to turn that on.${emailError ? ` (${escapeHtml(emailError)})` : ''}</p>`}
    <div style="display:flex; flex-direction:column; gap:10px">${userRows || '<p class="small">No accounts found.</p>'}</div>

    <h3 style="margin:28px 0 10px">Classes (${(classes || []).length})</h3>
    <div style="display:flex; flex-direction:column; gap:10px">${classRows || '<p class="small">No classes created yet.</p>'}</div>`;

  el.querySelectorAll('select[data-role-for]').forEach(sel => sel.addEventListener('change', async () => {
    const id = sel.dataset.roleFor;
    const newRole = sel.value;
    sel.disabled = true;
    const { error } = await supa.from('profiles').update({ role: newRole }).eq('id', id);
    sel.disabled = false;
    if (error) { showToast('Could not change role: ' + error.message, 'bug'); return; }
    showToast('Role updated.', 'ok');
  }));

  el.querySelectorAll('[data-act="delete-class"]').forEach(btn => btn.addEventListener('click', async () => {
    const card = btn.closest('[data-class]');
    if (!confirm("Delete this class? Its students will lose access to that teacher's readings.")) return;
    const { error } = await supa.from('classes').delete().eq('id', card.dataset.class);
    if (error) { showToast('Could not delete: ' + error.message, 'bug'); return; }
    showToast('Class deleted.', 'ok');
    renderAdmin();
  }));
}

initAuth({ allow: ['teacher', 'admin'], onReady: startTeacherPage });
</script>
</body>
</html>
